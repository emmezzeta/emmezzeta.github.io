<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Error 404 · Marco S. Zanini</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..600&family=Martian+Mono&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#0e0e0d;color:#ebe9e3;font-family:Archivo,Helvetica,Arial,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:none}
.ui{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:clamp(16px,2.4vw,32px)}
.row{display:flex;justify-content:space-between;align-items:center;gap:16px}
.k{font-family:'Martian Mono',ui-monospace,monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin:0;padding:8px 12px;border-radius:999px;background:rgba(14,14,13,.88)}
.k a{color:inherit;text-decoration:none;pointer-events:auto}
a.b{pointer-events:auto;display:inline-flex;align-items:center;gap:12px;height:48px;padding:0 22px;border-radius:999px;background:#ebe9e3;color:#0e0e0d;text-decoration:none;font-family:'Martian Mono',monospace;font-size:11px;letter-spacing:.09em;text-transform:uppercase;transition:background-color .2s}
a.b:hover{background:#ef4d2c}
a:focus-visible{outline:2px solid #ef4d2c;outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (hover:none){canvas{cursor:auto}}
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<div class="ui">
 <div class="row"><p class="k"><a href="/">Marco S. Zanini</a></p><p class="k">Error 404</p></div>
 <h1 class="sr">Error 404: this page does not exist. Go back to the portfolio.</h1>
 <div class="row"><p class="k">Page not found</p><a class="b" href="/">Back to the portfolio</a></div>
</div>
<script>
/* A page of "error 404 · refresh the page", and a black hole drawn in the same letters.
   It follows the pointer, swallows the text it passes and bends what is left around it. */
(()=>{
const cv=document.getElementById('c'),x=cv.getContext('2d');
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const TXT='error 404 · ';
const RAMP=' .:-=+*#%@';
const FG='#ebe9e3',DIM='rgba(235,233,227,.22)',RED='#ef4d2c',BG='#0e0e0d';
let W,H,dpr,cw,ch,cols,rows,bg,FS;
const hole={x:0,y:0,tx:0,ty:0},mouse={on:false,t:0};
function hash(a,b){let h=(a*374761393+b*668265263)|0;h=(h^(h>>>13))*1274126177|0;return ((h^(h>>>16))>>>0)/4294967296}
function ch_at(c,r){const L=TXT.length;return TXT[((r*cols+c)+r*11)%L]}
function setup(){
 dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);
 FS=W<600?10:12;x.font=`${FS}px "Martian Mono", ui-monospace, monospace`;cw=x.measureText('M').width;ch=Math.round(FS*1.35);
 cols=Math.ceil(W/cw)+1;rows=Math.ceil(H/ch)+1;
 /* the page of text, drawn once */
 bg=document.createElement('canvas');bg.width=W*dpr;bg.height=H*dpr;const b=bg.getContext('2d');b.setTransform(dpr,0,0,dpr,0,0);
 b.fillStyle=BG;b.fillRect(0,0,W,H);b.font=x.font;b.textBaseline='top';b.fillStyle=DIM;
 for(let r=0;r<rows;r++){let line='';for(let c=0;c<cols;c++)line+=ch_at(c,r);b.fillText(line,0,r*ch)}
 if(!hole.x){hole.x=hole.tx=W/2;hole.y=hole.ty=H/2}
}
function frame(t){
 t/=1000;
 if(!mouse.on||t-mouse.t>4){/* left alone, it drifts */hole.tx=W/2+Math.sin(t*.21)*W*.22;hole.ty=H/2+Math.sin(t*.33+1)*H*.18}
 const k=RM?1:.075;hole.x+=(hole.tx-hole.x)*k;hole.y+=(hole.ty-hole.y)*k;
 const rh=Math.max(40,Math.min(W,H)*.1),reach=rh*4.4;
 x.drawImage(bg,0,0,W,H);
 const c0=Math.max(0,Math.floor((hole.x-reach)/cw)),c1=Math.min(cols,Math.ceil((hole.x+reach)/cw)),r0=Math.max(0,Math.floor((hole.y-reach*.75)/ch)),r1=Math.min(rows,Math.ceil((hole.y+reach*.75)/ch));
 x.fillStyle=BG;x.fillRect(c0*cw,r0*ch,(c1-c0)*cw,(r1-r0)*ch);
 x.textBaseline='top';
 const spin=RM?0:t*.9,a=rh*2.7,bb=rh*.42,tilt=-.08;
 for(let r=r0;r<r1;r++)for(let c=c0;c<c1;c++){
  const px=c*cw+cw/2,py=r*ch+ch/2,dx=px-hole.x,dy=py-hole.y,d=Math.hypot(dx,dy*1.15);
  /* rotate into the disk's frame */
  const ux=dx*Math.cos(tilt)+dy*Math.sin(tilt),uy=-dx*Math.sin(tilt)+dy*Math.cos(tilt);
  let g=0,hot=false;
  /* the accretion disk, flat across the hole; the near side passes in front of it */
  const de=(ux*ux)/(a*a)+(uy*uy)/(bb*bb);
  if(de<1&&(d>rh*.98||uy>0)){const e=1-de;g=Math.max(g,e*(.55+.45*Math.max(0,1-Math.abs(ux)/a))*(.75+.25*Math.sin(ux*.06-spin*3)))}
  /* the light bent over the top and under the bottom of the hole */
  const lt=Math.hypot(ux/(rh*1.75),(uy+rh*.12)/(rh*1.28));
  if(uy<rh*.1&&Math.abs(lt-1)<.16)g=Math.max(g,(1-Math.abs(lt-1)/.16)*.95);
  const lb=Math.hypot(ux/(rh*1.45),(uy-rh*.05)/(rh*1.08));
  if(uy>0&&Math.abs(lb-1)<.09)g=Math.max(g,(1-Math.abs(lb-1)/.09)*.6);
  /* the photon ring */
  if(Math.abs(d-rh*1.06)<rh*.08)g=Math.max(g,.9);
  if(d<rh&&!(de<1&&uy>0)){continue}
  if(g>.04){
   const i=Math.min(RAMP.length-1,1+Math.floor(g*(RAMP.length-1)));
   hot=g>.5&&hash(c,r+Math.floor(t*2))<.018;
   x.fillStyle=hot?RED:`rgba(235,233,227,${.5+.5*g})`;x.fillText(hot?ch_at(c,r):RAMP[i],c*cw,r*ch);continue}
  /* the page around it: swallowed near the hole, pulled into orbit a little further out */
  const pull=Math.pow(rh*1.6/Math.max(d,1),2);
  if(hash(c,r)<pull*1.35)continue;
  const ang=Math.atan2(dy,dx)+(RM?0:pull*1.6*Math.sin(spin*.4+d*.01))+pull*.9,rr=d*(1+pull*.55);
  const sc=Math.round((hole.x+Math.cos(ang)*rr)/cw),sr=Math.round((hole.y+Math.sin(ang)*rr/1.15)/ch);
  x.fillStyle=pull>.18?`rgba(235,233,227,${Math.min(.8,.34+pull*.6)})`:DIM;
  x.fillText(ch_at(((sc%cols)+cols)%cols,((sr%rows)+rows)%rows),c*cw,r*ch);
 }
 if(!RM)requestAnimationFrame(frame);
}
addEventListener('pointermove',e=>{mouse.on=true;mouse.t=performance.now()/1000;hole.tx=e.clientX;hole.ty=e.clientY;if(RM)requestAnimationFrame(frame)});
addEventListener('pointerdown',e=>{mouse.on=true;mouse.t=performance.now()/1000;hole.tx=e.clientX;hole.ty=e.clientY});
addEventListener('resize',()=>{setup();if(RM)requestAnimationFrame(frame)});
(document.fonts?document.fonts.ready:Promise.resolve()).then(()=>{setup();requestAnimationFrame(frame)});
})();
</script>
</body>
</html>
